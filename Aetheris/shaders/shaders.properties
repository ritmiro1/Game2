# ============================================================================
#  Aetheris Shaders - configuration
#  Photorealistic cinematic shader pack for Iris (Fabric 1.21.4) & OptiFine
#  All settings below appear in the in-game shader GUI.
# ============================================================================

# ---- GUI screens (declare every screen before populating it) ----
screen = <empty>
screen = Profiles
screen = Shadows
screen = Ambient Occlusion
screen = Volumetric Light
screen = Bloom and Flare
screen = Water
screen = Sky and Clouds
screen = Colour Grading
screen = Camera FX

# ---- Per-screen option placement ----
screen.Shadows = SHADOW_RESOLUTION SHADOW_SAMPLES SHADOW_SOFTNESS SHADOW_DISTANCE SHADOW_FADE
screen.Ambient Occlusion = SSAO_SAMPLES SSAO_RADIUS SSAO_STRENGTH SSAO_BIAS
screen.Volumetric Light = VOLUMETRIC_LIGHT VOLUMETRIC_STEPS VOLUMETRIC_STRENGTH
screen.Bloom and Flare = BLOOM BLOOM_STRENGTH BLOOM_THRESHOLD SUN_GLOW
screen.Water = WATER_WAVES WATER_WAVE_HEIGHT WATER_REFLECTION WATER_CLARITY WATER_CAUSTICS
screen.Sky and Clouds = CLOUDS_ENABLED CLOUD_QUALITY CLOUD_COVERAGE CLOUD_HEIGHT STARS MILKY_WAY CLOUD_SHADOWS SUN_SIZE
screen.Colour Grading = EXPOSURE SATURATION CONTRAST WHITE_BALANCE TONEMAP_CURVE VIGNETTE EMISSIVE_STRENGTH
screen.Camera FX = DOF DOF_STRENGTH FXAA SHARPEN DITHER SSR_STEPS SSR_STRENGTH

sliders = EXPOSURE SATURATION CONTRAST WHITE_BALANCE VIGNETTE \
          SHADOW_SOFTNESS SHADOW_FADE SHADOW_DISTANCE SSAO_RADIUS SSAO_STRENGTH \
          SSAO_BIAS VOLUMETRIC_STRENGTH BLOOM_STRENGTH BLOOM_THRESHOLD \
          WATER_WAVE_HEIGHT WATER_REFLECTION WATER_CLARITY \
          CLOUD_COVERAGE CLOUD_HEIGHT CLOUD_QUALITY SUN_SIZE SUN_GLOW \
          EMISSIVE_STRENGTH SSR_STRENGTH SHARPEN DOF_STRENGTH

# ---- Quality profiles ------------------------------------------------
profile.LOW! = SHADOW_RESOLUTION=1024 SHADOW_SAMPLES=4 VOLUMETRIC_LIGHT=0 \
               SSAO_SAMPLES=8 SSAO_RADIUS=1.0 BLOOM_STRENGTH=0.25 \
               SHADOW_DISTANCE=96.0 SSR_STEPS=8 WATER_WAVES=0 CLOUD_QUALITY=2 \
               MILKY_WAY=0 FXAA=1 DITHER=0

profile.MEDIUM! = SHADOW_RESOLUTION=2048 SHADOW_SAMPLES=8 VOLUMETRIC_LIGHT=1 \
                  VOLUMETRIC_STEPS=8 SSAO_SAMPLES=12 SSAO_STRENGTH=1.0 \
                  BLOOM_STRENGTH=0.42 SHADOW_DISTANCE=192.0 SSR_STEPS=12 \
                  WATER_WAVES=1 CLOUD_QUALITY=3 MILKY_WAY=0 FXAA=1

profile.HIGH! = SHADOW_RESOLUTION=3072 SHADOW_SAMPLES=12 VOLUMETRIC_LIGHT=1 \
                VOLUMETRIC_STEPS=16 SSAO_SAMPLES=16 SSAO_RADIUS=1.15 \
                BLOOM_STRENGTH=0.5 SHADOW_DISTANCE=256.0 SSR_STEPS=20 \
                WATER_WAVES=1 WATER_CAUSTICS=1 CLOUD_QUALITY=4 MILKY_WAY=1 FXAA=1

profile.ULTRA! = SHADOW_RESOLUTION=4096 SHADOW_SAMPLES=16 VOLUMETRIC_LIGHT=1 \
                 VOLUMETRIC_STEPS=32 VOLUMETRIC_STRENGTH=1.25 SSAO_SAMPLES=24 \
                 SSAO_RADIUS=1.5 SSAO_STRENGTH=1.3 BLOOM_STRENGTH=0.6 \
                 SHADOW_DISTANCE=320.0 SSR_STEPS=48 WATER_WAVES=1 \
                 WATER_CAUSTICS=1 CLOUD_QUALITY=6 MILKY_WAY=1 DOF=1 FXAA=1

# ---- Screen / GUI hints ---------------------------------------------
screen.Profiles.columns = 1

# ---- Texture / buffer management -------------------------------------
# HDR colour buffers, 16-bit float where available
const int colortex0Format = RGBA16F;
const int colortex1Format = RGBA16;
const int colortex2Format = RGBA16;
const int colortex3Format = R8;
const int shadowcolor0Format = RGBA8;
const bool colortex0Clear = true;

# ---- Optimisation flags ----------------------------------------------
# Enable mipmapped, linearly filtered colour on the lit buffer
const bool colortex0MipmapEnabled = false;
# Do not clear the depth buffers between passes (deferred pipeline needs them)
const bool depthtex0Clear = false;
const bool depthtex1Clear = false;

# Keep vanilla clouds available as a fallback visual layer
clouds = fast

# ---- Rain / weather ---------------------------------------------------
# Slight wetness build-up tint on surfaces during rain
wetnessHalflife = 240.0
drynessHalflife = 900.0

# ---- Misc -------------------------------------------------------------
oldLighting = false
separateAo = true
underwaterOverlay = false
sun = true
moon = true
vignette = false
