<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src blob:; object-src 'none'"
    />
    <title>LifeOS Viewer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #101713;
        color: #dbe7dd;
        font:
          13px 'Segoe UI',
          sans-serif;
        overflow: hidden;
      }
      header {
        height: 42px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 18px;
        border-bottom: 1px solid #ffffff14;
      }
      header span {
        color: #8f9f92;
        font-size: 11px;
      }
      main {
        height: calc(100% - 43px);
        position: relative;
        display: grid;
        place-items: center;
      }
      video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        outline: 0;
      }
      #error {
        padding: 35px;
        line-height: 1.9;
        position: absolute;
        max-width: 620px;
        text-align: center;
      }
      button {
        background: #b6edbd;
        border: 0;
        color: #183720;
        border-radius: 7px;
        padding: 9px 15px;
        cursor: pointer;
      }
      #error:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <header><strong>LifeOS Viewer</strong><span id="label">Подключение…</span></header>
    <main>
      <video id="screen" tabindex="0" autoplay muted></video>
      <div id="error"></div>
    </main>
    <script type="module" src="viewer.js"></script>
  </body>
</html>
