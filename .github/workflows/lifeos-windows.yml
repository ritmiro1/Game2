name: LifeOS Windows preview
on:
  push:
    branches: ['arena/4a8a838f-game2']
    paths-ignore: ['docs/**', '.github/workflows/lifeos-driver.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      LIFEOS_AUTO_CRAWL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: ./scripts/ci-run.ps1 npm ci --no-audit --no-fund
      - run: ./scripts/ci-run.ps1 npm run format:check
      - run: ./scripts/ci-run.ps1 npm audit --omit=dev --audit-level=high
      - run: ./scripts/ci-run.ps1 npm test
      - run: ./scripts/ci-run.ps1 npm run build
      - name: Smoke-test Electron renderer and SQLite
        shell: pwsh
        run: |
          $env:LIFEOS_SMOKE_DIR = Join-Path $env:RUNNER_TEMP 'lifeos-source-smoke'
          New-Item -ItemType Directory -Force $env:LIFEOS_SMOKE_DIR | Out-Null
          ./scripts/ci-run.ps1 node scripts/smoke-electron.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Electron source smoke failed' }
          $file = Join-Path $env:LIFEOS_SMOKE_DIR 'smoke-result.json'
          if (!(Test-Path $file)) { throw 'No Electron smoke result' }
          Get-Content $file
          Remove-Item Env:LIFEOS_SMOKE_DIR
      - name: Build Windows installer and portable EXE
        run: npx electron-builder --win nsis portable --x64 --publish never
      - name: Smoke-test packaged EXE
        shell: pwsh
        run: |
          $env:LIFEOS_SMOKE_DIR = Join-Path $env:RUNNER_TEMP 'lifeos-packaged-smoke'
          New-Item -ItemType Directory -Force $env:LIFEOS_SMOKE_DIR | Out-Null
          $app = Join-Path (Get-Location) 'release/win-unpacked/LifeOS.exe'
          $env:LIFEOS_EXE = $app
          ./scripts/ci-run.ps1 node scripts/smoke-electron.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Packaged smoke failed' }
          Remove-Item Env:LIFEOS_EXE
          $file = Join-Path $env:LIFEOS_SMOKE_DIR 'smoke-result.json'
          if (!(Test-Path $file)) { throw 'No packaged smoke result' }
          Copy-Item $file release/Windows-smoke.json
          Get-Content $file
          Remove-Item Env:LIFEOS_SMOKE_DIR
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile experimental software-device host
        shell: cmd
        working-directory: native/virtual-display/device
        run: build.cmd
      - name: Package sources and calculate checksums
        shell: pwsh
        run: |
          Copy-Item native/virtual-display/device/LifeOSDisplayDevice.exe release/LifeOSDisplayDevice-experimental.exe
          New-Item -ItemType Directory -Force virtual-display-source | Out-Null
          Copy-Item -Recurse native/virtual-display/driver,native/virtual-display/device virtual-display-source/
          Copy-Item native/virtual-display/LICENSE,native/virtual-display/README.ru.md,native/virtual-display/packages.config,native/virtual-display/Directory.Build.props virtual-display-source/
          Get-ChildItem virtual-display-source -Recurse -File | Where-Object { $_.Extension -in '.obj','.exe' } | Remove-Item
          Compress-Archive -Path virtual-display-source/* -DestinationPath release/LifeOS-0.1.0-VirtualDisplay-source.zip
          New-Item -ItemType Directory -Force search-package | Out-Null
          Copy-Item -Recurse core,server search-package/
          Copy-Item package.json,package-lock.json,Dockerfile,compose.yaml,.env.example,LICENSE,README.md search-package/
          Compress-Archive -Path search-package/* -DestinationPath release/LifeOS-0.1.0-SearchServer.zip
          $assets = Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe','.zip','.json' -and $_.Name -notlike 'builder-*' }
          $assets | ForEach-Object { $hash=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(); "$hash  $($_.Name)" } | Set-Content -Encoding utf8 release/SHA256SUMS.txt
      - name: Archive runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-runtime-diagnostics
          path: ${{ runner.temp }}/lifeos-*-smoke/*
      - uses: actions/upload-artifact@v4
        with:
          name: LifeOS-Windows-preview
          path: |
            release/*.exe
            release/*.zip
            release/Windows-smoke.json
            release/SHA256SUMS.txt
      - name: Publish GitHub prerelease
        if: github.ref == 'refs/heads/arena/4a8a838f-game2'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "lifeos-v0.1.0-preview.${{ github.run_number }}"
          $notes = @'
          ## LifeOS 0.1.0 — предварительная Windows x64 версия
          Рабочий стол, окна, локальные приложения и SQLite, встроенный Chromium и собственный ограниченный обновляемый веб-индекс.
          EXE и установщик не подписаны. Windows может показать предупреждение. Проверяйте SHA256SUMS и источник загрузки.
          
          **Это не завершённая новая ОС и не поисковик с охватом всего интернета.**
          **Production-драйвер виртуального монитора не готов и не устанавливается.**
          VirtualDisplay-source.zip содержит экспериментальные исходники IddCx; отдельный device host НЕ является драйвером и сам не создаёт работающий дисплей без корректно установленного драйверного пакета.
          Viewer работает только с реально существующим дополнительным дисплеем, доступным для захвата; аппаратная совместимость не подтверждена.
          
          SearchServer.zip — исходники собственного поискового backend (Node.js 22.13+ / Docker), не развёрнутый публичный сервис. В EXE по умолчанию используется локальный индекс, обновляемый при работающем приложении.
          Подробности и ограничения — README в исходниках этого тега.
          '@
          $notes | Set-Content -Encoding utf8 release-notes.md
          $assets = @(Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe','.zip' } | ForEach-Object { $_.FullName })
          $assets += (Join-Path (Get-Location) 'release/Windows-smoke.json')
          $assets += (Join-Path (Get-Location) 'release/SHA256SUMS.txt')
          gh release create $tag @assets --target '${{ github.sha }}' --prerelease --title "LifeOS 0.1.0 preview · build ${{ github.run_number }}" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publish failed' }
