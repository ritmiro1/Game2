name: Windows portable build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to upload and publish (optional)'
        required: false
        default: 'v1.0.0'
        type: string
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
        env:
          PALIMPSEST_SERVER_URL: ${{ vars.PALIMPSEST_SERVER_URL }}
      - name: Verify Windows executable
        shell: pwsh
        run: |
          $asset = Get-ChildItem -Path release -Filter *.exe | Select-Object -First 1
          if (-not $asset) { throw 'Windows executable was not produced' }
          $hash = Get-FileHash -Algorithm SHA256 $asset.FullName
          Write-Output "RELEASE_SHA256=$($hash.Hash)"
          Write-Output "RELEASE_BYTES=$($asset.Length)"
      - uses: actions/upload-artifact@v4
        with:
          name: palimpsest-windows-x64
          path: release/*.exe
      - name: Publish manually dispatched release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $asset = Get-ChildItem -Path release -Filter *.exe | Select-Object -First 1
          gh release upload "${{ inputs.release_tag }}" $asset.FullName --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
          gh release edit "${{ inputs.release_tag }}" --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
